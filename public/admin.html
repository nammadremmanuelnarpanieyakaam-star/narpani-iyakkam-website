<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Volunteers — Admin | நற்பணி இயக்கம்</title>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7EF; --surface:#FFFFFF; --ink:#1E2E27; --ink-soft:#4B5E55;
    --primary:#1F4B3F; --gold:#E29B3E; --gold-soft:#F4DBAE; --line:#DCD5BE; --maroon:#A6403F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Catamaran',sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:40px 20px 80px;}

  /* Login screen */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:40px 32px;max-width:380px;width:100%;text-align:center;
  }
  .login-card .mark{
    width:64px;height:64px;border-radius:999px;margin:0 auto 16px;
    object-fit:cover;border:2px solid var(--gold);display:block;
  }
  .login-card h1{font-size:19px;font-weight:700;margin-bottom:6px;}
  .login-card p{font-size:13.5px;color:var(--ink-soft);margin-bottom:20px;}
  .login-card input{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;margin-bottom:12px;background:var(--bg);color:var(--ink);
  }
  .login-card button{
    width:100%;padding:12px;border-radius:999px;background:var(--primary);color:#fff;
    font-weight:700;font-size:14.5px;border:none;cursor:pointer;font-family:'Catamaran',sans-serif;
  }
  .error-msg{color:var(--maroon);font-size:13px;margin-top:10px;display:none;}

  /* Dashboard */
  #dashboard{display:none;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
  .top-bar h1{font-size:22px;font-weight:800;color:var(--primary);}
  .top-bar .sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .actions{display:flex;gap:10px;}
  .btn{
    padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:700;border:none;cursor:pointer;
    font-family:'Catamaran',sans-serif;
  }
  .btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary);}
  .btn-primary{background:var(--primary);color:#fff;}

  .stat-row{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .stat-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px 22px;min-width:140px;
  }
  .stat-card .num{font-size:26px;font-weight:800;color:var(--primary);font-family:'Catamaran',sans-serif;}
  .stat-card .label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line);}
  thead th{
    text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-soft);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--gold-soft);
  }
  tbody td{padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBF7;}
  .pill{
    display:inline-block;background:var(--gold-soft);color:var(--primary);
    padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
  }
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .table-wrap{overflow-x:auto;}
  .msg-cell{max-width:220px;white-space:pre-wrap;color:var(--ink-soft);}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <img class="mark" src="assets/logo-icon.png" alt="நற்பணி இயக்கம் logo" />
    <h1>Volunteer Admin</h1>
    <p>Enter your admin key to view volunteer sign-ups.</p>
    <input type="password" id="keyInput" placeholder="Admin key" />
    <button onclick="login()">View Sign-ups</button>
    <p class="error-msg" id="loginError">Incorrect key, or admin access isn't configured on the server yet.</p>
  </div>
</div>

<div id="dashboard">
  <div class="wrap">
    <div class="top-bar">
      <div>
        <h1>Volunteer Sign-ups</h1>
        <div class="sub" id="subline">—</div>
      </div>
      <div class="actions">
        <button class="btn btn-outline" onclick="loadVolunteers()">Refresh</button>
        <button class="btn btn-outline" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="stat-row" id="statRow"></div>

    <div class="table-wrap">
      <table id="volTable">
        <thead>
          <tr>
            <th>Name</th><th>Phone</th><th>Email</th><th>Interested In</th><th>Message</th><th>Submitted</th>
          </tr>
        </thead>
        <tbody id="volBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">No volunteer sign-ups yet.</div>
    </div>
  </div>
</div>

<script>
  const KEY_STORAGE = 'narpani_admin_key';

  window.addEventListener('DOMContentLoaded', () => {
    const savedKey = sessionStorage.getItem(KEY_STORAGE);
    if (savedKey) {
      showDashboard();
      loadVolunteers();
    }
  });

  function login() {
    const key = document.getElementById('keyInput').value.trim();
    if (!key) return;
    sessionStorage.setItem(KEY_STORAGE, key);
    showDashboard();
    loadVolunteers();
  }

  function logout() {
    sessionStorage.removeItem(KEY_STORAGE);
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('keyInput').value = '';
  }

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }

  async function loadVolunteers() {
    const key = sessionStorage.getItem(KEY_STORAGE);
    try {
      const res = await fetch('/api/volunteers', {
        headers: { 'x-api-key': key }
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        if (res.status === 401) {
          sessionStorage.removeItem(KEY_STORAGE);
          document.getElementById('loginError').style.display = 'block';
          document.getElementById('dashboard').style.display = 'none';
          document.getElementById('loginScreen').style.display = 'flex';
          return;
        }
        throw new Error(data.error || 'Failed to load');
      }

      renderVolunteers(data.volunteers);
    } catch (err) {
      alert('Could not load volunteers: ' + err.message);
    }
  }

  function renderVolunteers(list) {
    document.getElementById('subline').textContent =
      list.length + ' volunteer' + (list.length === 1 ? '' : 's') + ' signed up so far';

    document.getElementById('statRow').innerHTML = `
      <div class="stat-card"><div class="num">${list.length}</div><div class="label">Total Sign-ups</div></div>
      <div class="stat-card"><div class="num">${countToday(list)}</div><div class="label">Today</div></div>
    `;

    const body = document.getElementById('volBody');
    const empty = document.getElementById('emptyState');
    const table = document.getElementById('volTable');

    if (!list.length) {
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    table.style.display = 'table';
    empty.style.display = 'none';

    body.innerHTML = list.map(v => `
      <tr>
        <td><strong>${escapeHtml(v.name)}</strong></td>
        <td>${escapeHtml(v.phone)}</td>
        <td>${escapeHtml(v.email || '—')}</td>
        <td><span class="pill">${escapeHtml(v.interest || '—')}</span></td>
        <td class="msg-cell">${escapeHtml(v.message || '—')}</td>
        <td>${formatDate(v.created_at)}</td>
      </tr>
    `).join('');
  }

  function countToday(list) {
    const today = new Date().toISOString().slice(0, 10);
    return list.filter(v => (v.created_at || '').startsWith(today)).length;
  }

  function formatDate(str) {
    if (!str) return '—';
    const d = new Date(str.replace(' ', 'T') + 'Z');
    if (isNaN(d)) return str;
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('keyInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
  });
</script>

</body>
</html>
